[package]
name = "vantage-hal"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
default = ["std"]
# Host builds: the shader crate is compiled with std (pliron available).
std = ["vantage-shader/std"]
# AMDGPU hardware execution backend (GFX10.3 / RDNA2), using pure-Rust code generation.
amdgpu = ["dep:vantage-drm", "vantage-shader/backend-amdgpu"]

[dependencies]
bytemuck.workspace = true
vantage-raster = { path = "../raster", default-features = false }
vantage-shader = { path = "../shader", default-features = false }
vantage-drm = { path = "../drm", default-features = false, optional = true }
hashbrown.workspace = true
smallvec = { version = "1.16.1", default-features = false }

[[example]]
name = "amdgpu_bringup"
required-features = ["amdgpu"]

