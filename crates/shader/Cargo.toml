[package]
name = "vantage-shader"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
default = ["std"]
std = ["pliron?/std", "vantage-raster/std"]
# SPIR-V module parsing (host-side tooling; rspirv requires std).
spirv-frontend = ["std", "dep:rspirv", "dep:spirv"]
# AMDGPU (GFX10.3 / RDNA2) shader programs, compiled to machine code by
# `vantage-codegen`. Pure Rust: no LLVM toolchain and no ELF container.
backend-amdgpu = [
    "dep:pliron",
    "dep:pliron-llvm",
    "dep:vantage-codegen",
]

[dependencies]
libm.workspace = true
vantage-raster = { path = "../raster", default-features = false }
vantage-codegen = { path = "../codegen", optional = true }
pliron = { git = "https://github.com/pliron-org/pliron", default-features = false, optional = true }
pliron-llvm = { git = "https://github.com/pliron-org/pliron", default-features = false, optional = true }
rspirv = { workspace = true, optional = true }
spirv = { workspace = true, optional = true }
