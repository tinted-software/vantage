[workspace]
members = ["crates/hal", "crates/raster", "crates/shader", "crates/gles", "crates/egl", "crates/vulkan", "crates/drm", "crates/gbm"]
resolver = "3"

[workspace.dependencies]
bytemuck = { version = "1.25.2", default-features = false, features = ["derive"] }
glam = { version = "0.33.7", default-features = false, features = ["nostd-libm", "all-types"] }
hashbrown = { version = "0.17.1", default-features = false, features = ["alloc", "default-hasher"] }
lock_api = "0.4.14"
libm = { version = "0.2.16", default-features = false }
rspirv = { git = "https://github.com/gfx-rs/rspirv", default-features = false }
spin = { version = "0.12.3", default-features = false, features = ["mutex", "spin_mutex", "rwlock", "once", "lazy"] }
spirv = { git = "https://github.com/gfx-rs/rspirv", default-features = false }

[profile.dev]
opt-level = 2
split-debuginfo = "packed"
panic = "abort"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
